services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: smena
      POSTGRES_USER: smena
      POSTGRES_PASSWORD: smena_dev
    ports:
      - "5432:5432"
    volumes:
      - smena_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smena -d smena"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Jednokratni posao: primenjuje migracije i staje. Isti princip važi i u produkciji,
  # gde se bundle pokreće kao zaseban korak deploy-a, pre nego što krene novi API.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrate
    environment:
      ConnectionStrings__Smena: "Host=db;Port=5432;Database=smena;Username=smena;Password=smena_dev"
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  mailpit:
    image: axllent/mailpit
    ports:
      - "8025:8025"   # web UI za pregled poslatih mejlova
      - "1025:1025"   # SMTP

  api:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      migrate:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Smena: "Host=db;Port=5432;Database=smena;Username=smena;Password=smena_dev"
      Jwt__SigningKey: "dev-only-signing-key-change-me-0123456789abcdef"
      Database__MigrateOnStartup: "false"
      Email__Host: mailpit
      Email__Port: "1025"
      Email__UseTls: "false"
      App__FrontendUrl: "http://localhost:4200"
    ports:
      - "8080:8080"

volumes:
  smena_pgdata:
